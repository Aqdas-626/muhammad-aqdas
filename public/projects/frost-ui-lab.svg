<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#040b1a"/>
      <stop offset="0.7" stop-color="#08152e"/>
      <stop offset="1" stop-color="#030814"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#bg2)"/>

  <!-- Left Sidebar (Component Explorer) -->
  <rect x="60" y="60" width="320" height="880" rx="20" fill="#0b1733" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.2"/>
  <rect x="95" y="100" width="140" height="18" rx="4" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="95" y="140" width="80" height="10" rx="3" fill="#64748b"/>

  <!-- Sidebar Items -->
  <g transform="translate(95, 190)">
    <rect width="250" height="48" rx="10" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.3"/>
    <text x="20" y="30" fill="#38bdf8" font-family="monospace" font-size="14">Spring Physics Lab</text>
  </g>
  <g transform="translate(95, 255)">
    <rect width="250" height="48" rx="10" fill="none" stroke="#38bdf8" stroke-opacity="0.1"/>
    <text x="20" y="30" fill="#94a3b8" font-family="monospace" font-size="14">Glassmorphism Blur</text>
  </g>
  <g transform="translate(95, 320)">
    <rect width="250" height="48" rx="10" fill="none" stroke="#38bdf8" stroke-opacity="0.1"/>
    <text x="20" y="30" fill="#94a3b8" font-family="monospace" font-size="14">Kinetic Typography</text>
  </g>
  <g transform="translate(95, 385)">
    <rect width="250" height="48" rx="10" fill="none" stroke="#38bdf8" stroke-opacity="0.1"/>
    <text x="20" y="30" fill="#94a3b8" font-family="monospace" font-size="14">Gesture Transforms</text>
  </g>

  <!-- Main Canvas Area -->
  <rect x="410" y="60" width="1130" height="880" rx="20" fill="#071126" fill-opacity="0.75" stroke="#38bdf8" stroke-opacity="0.2"/>

  <!-- Canvas Header -->
  <rect x="460" y="110" width="220" height="28" rx="6" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="460" y="150" width="420" height="12" rx="3" fill="#64748b"/>

  <!-- Interactive Spring Physics Widget Box -->
  <rect x="460" y="210" width="1030" height="340" rx="16" fill="#0d1f42" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.25"/>
  <text x="500" y="260" fill="#7dd3fc" font-family="monospace" font-size="14" letter-spacing="1">LIVE PHYSICS WAVEFORM MONITOR</text>

  <!-- Big Fluid Waveform -->
  <path d="M480 390 C 600 240, 700 480, 840 330 C 980 180, 1080 490, 1220 340 C 1340 210, 1420 400, 1480 360" fill="none" stroke="url(#waveGrad)" stroke-width="4"/>
  <path d="M480 390 C 600 280, 700 440, 840 350 C 980 260, 1080 430, 1220 350 C 1340 270, 1420 380, 1480 360" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.5"/>

  <!-- 3 Interactive Control Cards -->
  <g transform="translate(460, 590)">
    <rect width="320" height="220" rx="14" fill="#0b1733" stroke="#38bdf8" stroke-opacity="0.2"/>
    <text x="30" y="45" fill="#e2e8f0" font-family="monospace" font-size="15">Stiffness: 450</text>
    <rect x="30" y="75" width="260" height="8" rx="4" fill="#1e293b"/>
    <rect x="30" y="75" width="180" height="8" rx="4" fill="#38bdf8"/>
    <circle cx="210" cy="79" r="8" fill="#ffffff"/>
    <text x="30" y="130" fill="#e2e8f0" font-family="monospace" font-size="15">Damping: 30</text>
    <rect x="30" y="160" width="260" height="8" rx="4" fill="#1e293b"/>
    <rect x="30" y="160" width="120" height="8" rx="4" fill="#38bdf8"/>
    <circle cx="150" cy="164" r="8" fill="#ffffff"/>
  </g>

  <g transform="translate(815, 590)">
    <rect width="320" height="220" rx="14" fill="#0b1733" stroke="#38bdf8" stroke-opacity="0.2"/>
    <text x="30" y="45" fill="#e2e8f0" font-family="monospace" font-size="15">Frosted Specular</text>
    <rect x="30" y="75" width="260" height="110" rx="8" fill="#13274f" fill-opacity="0.6" stroke="#7dd3fc" stroke-opacity="0.3"/>
    <circle cx="160" cy="130" r="30" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8"/>
  </g>

  <g transform="translate(1170, 590)">
    <rect width="320" height="220" rx="14" fill="#0b1733" stroke="#38bdf8" stroke-opacity="0.2"/>
    <text x="30" y="45" fill="#e2e8f0" font-family="monospace" font-size="15">Preset Profiles</text>
    <rect x="30" y="75" width="120" height="32" rx="6" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.4"/>
    <rect x="160" y="75" width="120" height="32" rx="6" fill="#1e293b"/>
    <rect x="30" y="120" width="120" height="32" rx="6" fill="#1e293b"/>
    <rect x="160" y="120" width="120" height="32" rx="6" fill="#1e293b"/>
  </g>

  <!-- Center Placeholder Label Pill -->
  <g transform="translate(560, 880)">
    <rect width="480" height="44" rx="22" fill="#030712" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="240" y="27" fill="#7dd3fc" font-family="monospace" font-size="13" font-weight="500" letter-spacing="2" text-anchor="middle">
      PROJECT SCREENSHOT PLACEHOLDER • 1600 × 1000
    </text>
  </g>
</svg>
