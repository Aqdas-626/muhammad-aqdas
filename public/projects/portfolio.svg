<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030712"/>
      <stop offset="0.6" stop-color="#050e1f"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="crystalFace1" x1="800" y1="280" x2="1050" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e0f2fe" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="crystalFace2" x1="550" y1="520" x2="800" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0369a1" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- Perspective Grid Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
    <line x1="800" y1="0" x2="800" y2="1000"/>
    <line x1="1000" y1="0" x2="1000" y2="1000"/>
    <line x1="1200" y1="0" x2="1200" y2="1000"/>
    <line x1="1400" y1="0" x2="1400" y2="1000"/>
  </g>

  <!-- Faux App Navigation Bar -->
  <rect x="80" y="50" width="1440" height="64" rx="32" fill="#0b1329" fill-opacity="0.75" stroke="#38bdf8" stroke-opacity="0.2"/>
  <circle cx="120" cy="82" r="6" fill="#38bdf8"/>
  <rect x="140" y="75" width="90" height="14" rx="4" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="680" y="76" width="60" height="12" rx="3" fill="#94a3b8" fill-opacity="0.4"/>
  <rect x="760" y="76" width="60" height="12" rx="3" fill="#94a3b8" fill-opacity="0.4"/>
  <rect x="840" y="76" width="60" height="12" rx="3" fill="#94a3b8" fill-opacity="0.4"/>
  <rect x="1380" y="66" width="110" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4"/>

  <!-- Core 3D Light Glow -->
  <circle cx="800" cy="520" r="320" fill="url(#coreGlow)"/>

  <!-- Central Faceted Crystal Mesh -->
  <polygon points="800,280 1050,440 800,600 550,440" fill="url(#crystalFace1)" stroke="#7dd3fc" stroke-width="2" stroke-opacity="0.8"/>
  <polygon points="550,440 800,600 800,780 550,620" fill="url(#crystalFace2)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
  <polygon points="800,600 1050,440 1050,620 800,780" fill="url(#crystalFace1)" stroke="#0284c7" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Wireframe Inner Core -->
  <polygon points="800,400 920,480 800,560 680,480" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="800" y1="400" x2="800" y2="560" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="680" y1="480" x2="920" y2="480" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Satellite Orbiting Shards -->
  <polygon points="420,380 470,410 440,460 390,430" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="1180,580 1230,610 1200,660 1150,630" fill="#7dd3fc" fill-opacity="0.18" stroke="#7dd3fc" stroke-width="1.5"/>

  <!-- Floating HUD Telemetry Badges -->
  <g transform="translate(140, 480)">
    <rect width="240" height="90" rx="16" fill="#0b1329" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.25"/>
    <circle cx="32" cy="35" r="4" fill="#34d399"/>
    <text x="48" y="39" fill="#94a3b8" font-family="monospace" font-size="12" letter-spacing="1.5">FPS ENGINE</text>
    <text x="32" y="70" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="600">60-120 FPS</text>
  </g>

  <g transform="translate(1220, 360)">
    <rect width="240" height="90" rx="16" fill="#0b1329" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.25"/>
    <circle cx="32" cy="35" r="4" fill="#38bdf8"/>
    <text x="48" y="39" fill="#94a3b8" font-family="monospace" font-size="12" letter-spacing="1.5">CAMERA RIG</text>
    <text x="32" y="70" fill="#ffffff" font-family="monospace" font-size="16">[0, 0, 7.8]</text>
  </g>

  <!-- Center Placeholder Label Pill -->
  <g transform="translate(560, 880)">
    <rect width="480" height="44" rx="22" fill="#030712" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="240" y="27" fill="#7dd3fc" font-family="monospace" font-size="13" font-weight="500" letter-spacing="2" text-anchor="middle">
      PROJECT SCREENSHOT PLACEHOLDER • 1600 × 1000
    </text>
  </g>
</svg>
